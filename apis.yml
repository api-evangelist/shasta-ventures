aid: shasta-ventures
name: Shasta Ventures
description: >-
  Shasta Ventures is an early-stage venture capital firm founded in 2004 and
  based in Silicon Valley (Portola Valley / Menlo Park, on and around Sand Hill
  Road, California). Founded by Rob Coneybeer and Ravi Mohan (with Tod Francis
  and Jason Pressman among its long-tenured Managing Directors), the firm invests
  primarily at the Series A stage in United States technology startups, typically
  leading rounds and taking board seats. Shasta has roughly $1.3B under management
  across multiple funds (Fund II $250M, Fund III $265M, Fund IV $300M) and a
  20-year track record. Its thesis centers on enterprise software / SaaS,
  cybersecurity, developer tools and infrastructure, data intelligence, camera /
  computer vision, and consumer subscription products, pairing capital with
  operational support (Shasta Elevate) for technical founders. Notable investments
  include Anaplan, Zuora, Nest, Nextdoor, Apptio, Eero, Sendbird, Tonal, Lattice,
  Highspot, SentinelOne and Turo, with 12 unicorns, multiple IPOs and dozens of
  acquisitions across its history.
